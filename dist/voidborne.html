<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>VOIDBORNE — a procedural universe</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cfe3ef}
canvas#c{display:block;width:100%;height:100%;touch-action:none}
.ui{position:fixed;pointer-events:none;text-shadow:0 0 8px #000,0 0 2px #000;letter-spacing:.1em;font-size:12px}
#hud{left:18px;bottom:16px;line-height:1.7}
#hud b{font-size:22px;font-weight:400;letter-spacing:.05em}
#disc{right:18px;bottom:16px;text-align:right;line-height:1.7}
#radar{position:fixed;right:18px;top:16px;width:170px;height:170px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(10,30,50,.55),rgba(0,5,15,.75));border:1px solid rgba(140,200,240,.35)}
#label{left:50%;top:56%;transform:translateX(-50%);font-size:14px;letter-spacing:.35em;opacity:0;transition:opacity .5s;text-align:center}
#label small{display:block;font-size:10px;letter-spacing:.2em;opacity:.7;margin-top:4px}
#toast{left:50%;top:14%;transform:translateX(-50%);font-size:13px;letter-spacing:.3em;opacity:0;transition:opacity .6s;color:#ffe9b0}
#cross{left:50%;top:50%;width:6px;height:6px;margin:-3px;border:1px solid rgba(200,230,255,.5);border-radius:50%}
#hint{left:50%;top:14px;transform:translateX(-50%);opacity:0;transition:opacity .4s}
.btn{background:rgba(8,20,40,.6);border:1px solid rgba(140,200,240,.4);color:#cfe3ef;padding:8px 14px;font:12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.15em;cursor:pointer;backdrop-filter:blur(4px);user-select:none;pointer-events:auto}
.btn:hover{background:rgba(30,70,110,.7)}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,2,10,.6);backdrop-filter:blur(8px);z-index:5}
.card{max-width:560px;margin:16px;padding:32px 40px;border:1px solid rgba(140,200,240,.3);background:rgba(2,8,22,.85);text-align:center;box-shadow:0 0 80px rgba(40,100,200,.25)}
.card h1{margin:0 0 6px;font-weight:300;font-size:40px;letter-spacing:.5em;padding-left:.5em}
.card p{margin:8px 0;font-size:13px;line-height:1.7;opacity:.85}
.keys{margin:14px 0 4px;font-size:12px;opacity:.8;line-height:2}
.keys span{display:inline-block;border:1px solid rgba(140,200,240,.35);padding:0 6px;margin:0 2px;border-radius:3px}
.card button{margin-top:14px;padding:12px 34px;font-size:14px}
#pause{display:none}
#pause label{display:block;margin:10px 0;font-size:12px;letter-spacing:.15em}
#pause input[type=range]{width:220px;vertical-align:middle}
#pause select{background:#061020;color:#cfe3ef;border:1px solid rgba(140,200,240,.4);padding:4px;font-family:inherit}
#touch{position:fixed;inset:0;display:none;pointer-events:none;z-index:3}
#stick{position:absolute;left:30px;bottom:30px;width:120px;height:120px;border-radius:50%;border:1px solid rgba(140,200,240,.4);background:rgba(10,30,50,.3)}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(140,200,240,.5)}
#tbtns{position:absolute;right:24px;bottom:30px;display:flex;flex-direction:column;gap:10px}
#tbtns .btn{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
#err{position:fixed;left:0;top:0;right:0;color:#ff9090;background:#000;padding:12px;white-space:pre-wrap;font-size:12px;display:none;z-index:9}
#edge{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(90,10,10,.85) 100%);transition:opacity .3s}
#entry{left:50%;bottom:64px;transform:translateX(-50%);font-size:12px;letter-spacing:.25em;color:#9dffb0;opacity:0;transition:opacity .5s;text-align:center}
#warn{left:50%;top:40px;transform:translateX(-50%);font-size:11px;letter-spacing:.2em;color:#ffcf80;opacity:0;transition:opacity .5s}
#signal{left:18px;bottom:100px;color:#b8ffd0;font-size:11px}
#apl{left:50%;bottom:38px;transform:translateX(-50%);color:#9fd8ff;font-size:12px;letter-spacing:.25em}
#logbox{position:fixed;left:18px;bottom:130px;max-width:420px;padding:12px 16px;border:1px solid rgba(150,255,190,.35);background:rgba(0,14,8,.75);color:#b8ffd0;font-size:12px;line-height:1.7;letter-spacing:.05em;white-space:pre-wrap;opacity:0;transition:opacity .6s;pointer-events:none;z-index:4}
#map{position:fixed;inset:0;width:100%;height:100%;display:none;z-index:6;background:rgba(0,3,10,.94);cursor:crosshair}
#mapinfo{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:none;z-index:7;font-size:12px;letter-spacing:.15em;text-align:center;color:#cfe3ef;text-shadow:0 0 6px #000;pointer-events:none}
#codex{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,2,10,.7);z-index:7}
#codex .card{max-width:720px;width:90%;max-height:80vh;overflow:auto;text-align:left}
#codexlist div{border-top:1px solid rgba(140,200,240,.15);padding:8px 0;font-size:12px;line-height:1.6}
#codexlist small{opacity:.6}
#rec{position:fixed;left:18px;top:16px;color:#ff6b6b;font-size:12px;letter-spacing:.2em;display:none;z-index:8;text-shadow:0 0 6px #000}
#photohint{position:fixed;left:50%;top:18px;transform:translateX(-50%);font-size:12px;letter-spacing:.2em;color:#cfe3ef;opacity:0;transition:opacity .6s;z-index:8;text-shadow:0 0 6px #000;pointer-events:none}
#shot{position:fixed;right:18px;bottom:18px;display:none;z-index:9;padding:10px;border:1px solid rgba(140,200,240,.4);background:rgba(2,8,22,.9);max-width:340px;font-size:11px;line-height:1.6}
#shot img,#shot video{display:block;max-width:320px;max-height:180px;margin-bottom:6px}
#prompt{left:50%;top:calc(50% + 26px);transform:translateX(-50%);font-size:13px;letter-spacing:.2em;color:#e9fff0;opacity:0;transition:opacity .25s}
#goal{left:18px;top:42px;font-size:11px;letter-spacing:.18em;color:#bfe9ff;opacity:0;transition:opacity .8s}
#room{left:50%;bottom:86px;transform:translateX(-50%);font-size:11px;letter-spacing:.3em;color:#cfe3ef;opacity:0;transition:opacity .8s}
#scanbox{position:fixed;left:calc(50% + 64px);top:calc(50% - 72px);width:300px;padding:10px 14px;border-left:1px solid rgba(120,230,255,.6);background:linear-gradient(90deg,rgba(0,20,32,.6),rgba(0,20,32,0));color:#bff4ff;font-size:11px;line-height:1.65;letter-spacing:.06em;opacity:0;transition:opacity .4s;pointer-events:none;z-index:4;text-shadow:0 0 6px #000}
#scanbox b{font-size:13px;letter-spacing:.2em;font-weight:400}
#scanbox span{opacity:.55;display:inline-block;min-width:104px}
#scanbox i{display:block;margin-top:6px;opacity:.8;font-style:normal;color:#e2f8ff}
@media (max-width:700px){#scanbox{left:50%;transform:translateX(-50%);top:calc(50% + 64px);width:min(300px,82vw)}}
@media (max-height:440px){#scanbox{top:10px;font-size:10px;line-height:1.45;padding:6px 10px}}
#tuse,#tscan{position:absolute;right:100px;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px}
#tscan{bottom:30px}#tuse{bottom:104px}
#scanst{left:50%;top:calc(50% - 60px);transform:translateX(-50%);font-size:11px;letter-spacing:.25em;color:#9ff0ff;opacity:0;transition:opacity .2s}
#introhint{left:50%;bottom:22px;transform:translateX(-50%);font-size:10px;letter-spacing:.3em;opacity:0;transition:opacity 1s}
#dbg{position:fixed;left:18px;top:64px;margin:0;padding:8px 10px;background:rgba(0,6,14,.75);border:1px solid rgba(140,200,240,.25);color:#cfe3ef;font:11px/1.55 ui-monospace,Menlo,Consolas,monospace;display:none;z-index:9;pointer-events:none;white-space:pre}
#radar{transition:opacity 1.2s}
body.intro .ui,body.intro #radar,body.intro #touch{opacity:0!important}
body.intro #introhint{opacity:.5!important}
#pause .card{max-height:92vh;overflow:auto}
#pause .sect{margin:16px 0 4px;font-size:10px;letter-spacing:.3em;opacity:.55;border-top:1px solid rgba(140,200,240,.15);padding-top:10px}
#pause details{margin:12px 0;text-align:left;font-size:12px}#pause summary{cursor:pointer;letter-spacing:.2em;text-align:center}
#bindlist{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:8px 0;align-items:center}#bindlist .btn{padding:3px 10px;min-width:70px;margin:0;font-size:12px}#bindlist span{font-size:12px;letter-spacing:.08em}#bindlist .wait{background:rgba(120,200,255,.35)}
.langsel{display:inline-block;margin:12px 0 0;font-size:11px;letter-spacing:.15em}.langsel select,#pause select{background:#061020;color:#cfe3ef;border:1px solid rgba(140,200,240,.4);padding:4px;font-family:inherit}
#caps{left:50%;bottom:112px;transform:translateX(-50%);text-align:center;font-size:12px;letter-spacing:.08em;line-height:1.7;color:#e8f4ff;max-width:80vw}
#caps div{display:inline-block;margin:2px 0;padding:1px 10px;background:rgba(0,0,0,.55);border-radius:3px;transition:opacity .6s}
#loading{position:fixed;inset:0;z-index:20;background:#000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .5s}
#loading.show{opacity:1;pointer-events:auto}
#loading .ldname{font-size:30px;font-weight:300;letter-spacing:.5em;padding-left:.5em;text-align:center;margin-bottom:22px}
#loading .ldtrack{width:min(360px,70vw);height:2px;background:rgba(140,200,240,.18)}#ldbar{width:0;height:100%;background:#9fd8ff;transition:width .25s}
#ldtxt{margin-top:14px;font-size:10px;letter-spacing:.3em;opacity:.6;text-align:center}
#surv{right:18px;bottom:64px;display:none;font-size:10px;letter-spacing:.15em}
#surv .sv{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:4px 0}#surv i{display:block;width:110px;height:4px;background:rgba(140,200,240,.18)}
#surv b{display:block;height:100%;width:100%;background:#9fd8ff;transition:width .3s,background .5s}#surv .low b{background:#ffb070}#surv .empty b{background:#ff7060}
.card .small{margin-top:6px;padding:5px 12px;font-size:11px}
#banner{position:fixed;left:50%;top:40%;transform:translateX(-50%);display:none;padding:14px 22px;border:1px solid rgba(255,200,120,.5);background:rgba(10,8,2,.85);color:#ffd9a0;font-size:12px;letter-spacing:.2em;z-index:8}
/* Phase 6B: comfort overlays, interface scale, start-screen notice */
:root{--uiz:1}
.ui,#radar,#logbox,.screen .card,#codex .card,#shot,#banner,#mapinfo,#rec,#photohint,#tbtns,#stick,#tuse,#tscan{zoom:var(--uiz)}
#horizon{left:0;top:0;width:100%;height:100%;zoom:1!important;display:none}
#rollvig{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:2;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 38%,rgba(0,0,0,.92) 100%)}
.card .photosens{font-size:10px;opacity:.6;line-height:1.6;border:1px solid rgba(255,207,128,.25);padding:6px 10px;margin:10px 0 2px}
#pause label b{font-weight:400;opacity:.7;display:inline-block;min-width:44px;text-align:right}
#qsrc{font-size:10px;opacity:.55;letter-spacing:.1em;margin:-4px 0 6px}
</style>
</head>

<script type="text/x-vb" data-name="setup" data-w="1">
'use strict';
/* =====================================================================
   VOIDBORNE — procedural universe in raw WebGL2 + Web Audio
   ---------------------------------------------------------------------
   TUNABLE CONSTANTS — edit freely
   ===================================================================== */
const CFG = {
  SEED: 1337, // overridden by #seed=NNNN in the URL
  WORLD_RADIUS: 5200, // soft boundary of the playable sphere
  PLANET_COUNT: 7, // 5–8 recommended
  ASTEROID_COUNT: 3200, // instanced belt rocks
  RING_ROCKS: 2600, // rocks in the ringed planet's ring
  MINNOW_SCHOOLS: 6, // boid flocks
  MINNOWS_PER_SCHOOL: 200, // 6×200 = 1200 small creatures
  WHALE_COUNT: 3,
  MEDUSA_COUNT: 36,
  WRECK_COUNT: 5, // derelict ships (wreck 0 is the explorable one)
  DEBRIS_PER_WRECK: 90,
  MAX_SPEED: 70, // m/s without boost
  BOOST_MULT: 4.0,
  THRUST: 60, // acceleration m/s²
  DRAG: 0.55, // per-second velocity damping
  LOOK_SENS: 0.0022,
  QUALITY: 'high', // 'low' | 'medium' | 'high' | 'ultra' (Phase 6B)  (render scale cap, bloom, sky bake size)
  BLOOM: true,
  TARGET_FRAME_MS: 17, // dynamic resolution scaler aims below this
  STAR_RADIUS: 230,
  MUSIC: true,
  // ---- added in Phase 1 ----
  NEBULA_INTENSITY: 0.55, // overall brightness of the baked nebula (0 = none, 1 = loud)
  GRADE_STRENGTH: 1.0, // 0..1 strength of the per-zone colour grading in the tonemap pass
  MIN_RENDER_SCALE: 0.7, // floor of the dynamic resolution scaler (fraction of canvas size)
  MOBILE_QUALITY: 'medium', // quality preset used on touch devices (unless #q= overrides)
  MOBILE_MSAA: 2, // MSAA samples on touch devices (desktop uses 4)
  MOBILE_DPR: 1.5, // devicePixelRatio cap on touch devices (desktop 2)
  BREACH_MARKER: true, // green marker lights + HUD hint at the explorable wreck's breach
  // ---- added in Phase 2 (each has a quality switch; 'low' disables or uses the cheap variant) ----

async function loadWorklet(AC) {
  if (!CFG.AUDIO_WORKLET || !AC.audioWorklet || typeof AudioWorkletNode === 'undefined') {
    AUD.wl = 'fallback (AudioWorklet unavailable)';
    return;
  }
  // Blob URL first; pages opened from disk have a null origin and some browsers refuse blob:null modules, so retry with a data: URL
  try {
    let loaded = false,
      firstErr = null;
    try {
      await AC.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET_SRC], { type: 'text/javascript' })));
      loaded = true;
      AUD.wlSrc = 'blob';
    } catch (e) {
      firstErr = e;
    }
    if (!loaded) {
      await AC.audioWorklet.addModule('data:text/javascript;charset=utf-8,' + encodeURIComponent(WORKLET_SRC));
      AUD.wlSrc = 'data';
    }
    const hiss = new AudioWorkletNode(AC, 'vb-hiss', { outputChannelCount: [2] });
    const hp = hiss.parameters.get('level');
    hp.value = 0.05;
    hiss.connect(AUD.muffle);
    AUD.hissNode = hiss;
    AUD.hissFB.mod.disconnect();
    AUD.hissFB.gain.gain.setTargetAtTime(0, AC.currentTime, 0.5);
    AUD.whaleNodes = AUD.whaleP.map((p) => {
      const n = new AudioWorkletNode(AC, 'vb-whale', { outputChannelCount: [1] });
      n.connect(p);
      n.connect(AUD.rev);
      return n;
    });
    AUD.wl = true;
    // if a processor ever throws, drop back to the node-graph synthesis (and restore the buffer hiss)
    const onErr = () => {
      if (AUD.wl !== true) return;
      AUD.wl = 'fallback (processor error)';
      try {
        AUD.hissNode.disconnect();
      } catch (e) {}
      AUD.hissFB.gain.gain.setTargetAtTime(0.05, AC.currentTime, 0.5);
    };
    hiss.onprocessorerror = onErr;
    for (const n of AUD.whaleNodes) n.onprocessorerror = onErr;

  }
}

// one candidate per object in the ready sectors: { ref, key, pos: the point of the object nearest the player, d, range, r }

  const out = [];
  const near = (ref, key, pos, range, r) => out.push({ ref, key, pos, d: len(sub(pos, P)), range, r });
  for (const s of readySectors()) {
    for (const c of s.comets) if (c.pos) near(c, 'comet', add(c.pos, scl(norm(sub(P, c.pos)), c.r)), 2000, 60);

function crateHit(w, lp, c) {

    ry = lp[1] - c.p[1],
    rz = lp[2] - c.p[2];
  if (Math.abs(rx) > c.h[0] + PLAYER_R + 3 || Math.abs(ry) > c.h[1] + PLAYER_R + 3 || Math.abs(rz) > c.h[2] + PLAYER_R + 3) return;

    sa = Math.sin(c.ang);
  const x = ca * rx - sa * rz;
  rz = sa * rx + ca * rz;
  rx = x;
  const dx = rx - clamp(rx, -c.h[0], c.h[0]),
    dy = ry - clamp(ry, -c.h[1], c.h[1]),
    dz = rz - clamp(rz, -c.h[2], c.h[2]);
  const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
  if (dist >= PLAYER_R) return;

  if (dist > 1e-6) {
    n = [dx / dist, dy / dist, dz / dist];
    pen = PLAYER_R - dist;

    const ex = c.h[0] - Math.abs(rx),
      ey = c.h[1] - Math.abs(ry),
      ez = c.h[2] - Math.abs(rz);
    n = ex <= ey && ex <= ez ? [Math.sign(rx) || 1, 0, 0] : ey <= ez ? [0, Math.sign(ry) || 1, 0] : [0, 0, Math.sign(rz) || 1];
    pen = Math.min(ex, ey, ez) + PLAYER_R;

  PROBE.t += Math.min(raw, 10000) / 1000;
  if (PROBE.t > 1 && raw < 10000) PROBE.ms.push(raw); // after the warm-up (shaders, uploads); a 10 s gap is a pause, not a frame
  // the window ends after AUTO_QUALITY_SECONDS with at least 8 frames, or after 20 s on a very slow machine (3 frames are enough then)
  if ((PROBE.t >= 1 + CFG.AUTO_QUALITY_SECONDS && PROBE.ms.length >= 8) || PROBE.t >= 20) probeFinish();
  return true;
}
addEventListener('visibilitychange', () => {
  if (document.hidden && PROBE.on) PROBE.t = Math.min(PROBE.t, 1); // hidden mid-measurement: warm up again when it comes back
});
function probeFinish() {
  PROBE.on = false;
  const a = PROBE.ms.slice().sort((x, y) => x - y);
  // the window only ends early with 8+ frames; fewer than 3 usable frames means 20 s of running produced almost none
  // (a hidden tab restarts the warm-up instead), so the machine is clearly too slow for 'high'
  const med = a.length >= 3 ? a[a.length >> 1] : Infinity;
  const [t1, t2] = CFG.AUTO_QUALITY_MS;
  const pick = med < t1 ? 'high' : med < t2 ? 'medium' : 'low';
  SETTINGS.qProbe = { ms: isFinite(med) ? Math.round(med * 10) / 10 : null, frames: a.length, pick };
  setQuality(pick, 'auto');
  toast(tl(PROBE.manual ? 'toast.autoqKeep' : 'toast.autoq', { q: t('q.' + pick).toUpperCase() }));
}
$('#autoq').addEventListener('click', () => {
  PROBE.manual = true;
  PROBE.wait = true; // starts as soon as the game runs (resume closes the pause menu)
  qsrcLine();
  if (paused) setPaused(false);
});
probeArm();
/* =====================================================================
   HIGH-RESOLUTION CAPTURE (Phase 6B)
   Photo mode (CFG.PHOTO_SCALE, pause-menu PHOTO RESOLUTION) and the debug build's screenshot(scale) render the frame
   offscreen at scale x the canvas size instead of reading the canvas back:
     one pass  when the size fits the GPU limits and CFG.PHOTO_ONEPASS_PIXELS: the whole pipeline at that size
     tiles     otherwise: tiles of up to CFG.PHOTO_TILE px with a 64 px guard band (bloom reaches across tile edges),
               each rendered with a cropped projection and stitched in a 2D canvas. The composite's screen-space effects
               (vignette, lens flare, aberration, visor) use whole-image coordinates, so they line up; god rays need the
               whole sun mask and are left out of tiled photos.
   With TAA on, CFG.PHOTO_FRAMES frames are accumulated per pass / tile (the scene is frozen in photo mode, so nothing
   ghosts). If the GPU cannot allocate a size (incomplete framebuffer or OUT_OF_MEMORY), the next smaller plan is tried:
   tiles, then smaller tiles, and finally the normal canvas capture, with a message saying what was saved.
   ===================================================================== */
const CAP = { job: null, fallback: false };
const CAP_GUARD = 64;
function capPlan(scale, tile) {
  const bw = canvas.width,
    bh = canvas.height;
  let W = Math.round(bw * scale),
    H = Math.round(bh * scale);
  const k = Math.min(1, CFG.PHOTO_MAX_SIDE / Math.max(W, H));
  W = Math.max(2, Math.floor(W * k));
  H = Math.max(2, Math.floor(H * k));

  const one = !tile && W <= GLMAX && H <= GLMAX && W * H <= CFG.PHOTO_ONEPASS_PIXELS;
  const tiles = [];
  if (one) tiles.push({ x: 0, y: 0, w: W, h: H, cx: 0, cy: 0, cw: W, ch: H });
  else {
    const core = T - 2 * CAP_GUARD;
    for (let y = 0; y < H; y += core)
      for (let x = 0; x < W; x += core) {
        const cw = Math.min(core, W - x),
          ch = Math.min(core, H - y);
        tiles.push({ x: x - CAP_GUARD, y: y - CAP_GUARD, w: cw + 2 * CAP_GUARD, h: ch + 2 * CAP_GUARD, cx: x, cy: y, cw, ch });
      }

}
// start a capture; done(result) gets { blob | dataURL, width, height, tiles, fallback } or { error }
function captureStart(scale, done, opt = {}) {
  if (CAP.job) return false;
  const job = {
    plan: capPlan(scale),
    scale,
    done,
    dataURL: !!opt.dataURL,
    frames: Math.max(1, opt.frames || (taaWanted() ? CFG.PHOTO_FRAMES : 1)),
    ti: 0,
    f: 0,
    out: null,
    ctx: null,
    fbo: null,
    tex: null,
    texW: 0,
    texH: 0,
    tries: 0,
    t0: performance.now(),

}
function capTarget(job, w, h) {
  if (job.texW === w && job.texH === h) return true;

    job.fbo = gl.createFramebuffer();
    job.tex = gl.createTexture();
  }
  tex2d(job.tex, w, h);
  gl.bindFramebuffer(gl.FRAMEBUFFER, job.fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, job.tex, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  job.texH = h;
  return ok;
}
function capFree(job) {
  if (job.fbo) {
    gl.deleteFramebuffer(job.fbo);
    gl.deleteTexture(job.tex);
  }
  job.fbo = job.tex = null;
  job.texW = job.texH = 0;
}
// the plan failed at this size: tiles, then smaller tiles, then give up (normal canvas capture)
function capShrink(job) {
  const p = job.plan;
  job.tries++;
  const nextT = p.one ? Math.min(CFG.PHOTO_TILE, GLMAX) : Math.floor(p.T / 2);
  if (nextT < 512 || job.tries > 4) return false;
  job.plan = capPlan(job.scale, nextT);
  job.ti = 0;
  job.f = 0;
  job.out = null;
  job.ctx = null;
  capFree(job);
  return true;
}
// one capture frame (the main loop calls this instead of render() while a capture runs). Returns true when it rendered.
function captureStep() {
  const job = CAP.job;
  if (!job) return false;
  const p = job.plan;
  const tl0 = p.tiles[job.ti];
  FB_QUIET = true;
  let ok = true;
  try {
    while (gl.getError() !== gl.NO_ERROR); // start clean, so an allocation failure below is ours
    if (job.f === 0) {
      taaValid = false; // every pass / tile starts its own history
      frameIdx = job.fi0;
    }
    ok = capTarget(job, tl0.w, tl0.h) && render({ W: p.W, H: p.H, x: tl0.x, y: tl0.y, w: tl0.w, h: tl0.h, fbo: job.fbo });
    if (ok && gl.getError() === gl.OUT_OF_MEMORY) ok = false;
  } catch (e) {
    ok = false;
  }
  FB_QUIET = false;
  if (!ok) {
    if (!capShrink(job)) capFinish(job, { error: 'alloc' });
    return true;
  }
  if (++job.f < job.frames) return true;
  // read this pass / tile back (core part only) into the stitched image
  if (!job.out) {
    job.out = document.createElement('canvas');
    job.out.width = p.W;
    job.out.height = p.H;
    job.ctx = job.out.getContext('2d');
    if (!job.ctx) {
      capFinish(job, { error: 'canvas' });
      return true;
    }
  }
  const px = new Uint8Array(tl0.cw * tl0.ch * 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, job.fbo);
  gl.readPixels(tl0.cx - tl0.x, tl0.cy - tl0.y, tl0.cw, tl0.ch, gl.RGBA, gl.UNSIGNED_BYTE, px);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  const img = job.ctx.createImageData(tl0.cw, tl0.ch);
  const row = tl0.cw * 4;
  for (let y = 0; y < tl0.ch; y++) img.data.set(px.subarray((tl0.ch - 1 - y) * row, (tl0.ch - y) * row), y * row); // GL rows are bottom-up
  job.ctx.putImageData(img, tl0.cx, p.H - tl0.cy - tl0.ch);
  job.f = 0;
  if (++job.ti < p.tiles.length) return true;
  capFinish(job, null);
  return true;
}
function capFinish(job, err) {
  CAP.job = null;
  capFree(job);
  taaValid = false;
  frameIdx = job.fiSave;
  const p = job.plan;
  const res = {
    width: p.W,
    height: p.H,
    tiles: p.one ? 1 : p.tiles.length,
    frames: job.frames,
    ms: Math.round(performance.now() - job.t0),
  };
  if (err) {
    job.done(Object.assign(res, { error: err.error }));
    return;
  }
  if (job.dataURL) job.done(Object.assign(res, { dataURL: job.out.toDataURL('image/png') }));
  else
    job.out.toBlob((blob) => {
      job.done(Object.assign(res, blob ? { blob } : { error: 'encode' }));
    }, 'image/png');
}
// debug build / tests: the whole capture at once (blocks until done)
function captureSync(scale, frames) {
  let result = null;
  if (!captureStart(scale, (r) => (result = r), { dataURL: true, frames })) return { error: 'busy' };
  let guard = 0;
  while (CAP.job && guard++ < 100000) captureStep();
  return result;
}
// photo mode: HD capture, or the old canvas capture at scale 1 (and as the last fallback)
function capturePhoto() {
  const scale = CFG.PHOTO_SCALE;
  if (!(scale > 1)) return capturePNG();
  if (CAP.job) {
    toast(tl('toast.capBusy'));
    return;
  }
  const p = capPlan(scale);
  hint(tl('photo.capturing', { w: p.W, h: p.H }), 60000);
  captureStart(scale, (r) => {
    hint('', 1);
    if (r.error) {
      toast(tl('toast.capSmaller', { w: p.W, h: p.H, w2: canvas.width, h2: canvas.height }));
      CAP.fallback = true; // the old canvas capture on the next frame
      PHOTO.capture = true;
      return;
    }
    if (r.tiles > 1) toast(tl('toast.capTiled', { w: r.width, h: r.height, n: r.tiles }));
    saveBlob(r.blob, 'voidborne-' + stamp() + '-' + r.width + 'x' + r.height + '.png', 'image');
  });
}
/* =====================================================================
   MAIN LOOP
   ===================================================================== */
/* ---- context loss recovery: recreate every GL object in place (programs, meshes, VAOs, FBOs, sky bake) ---- */
function rebuildGL() {
  for (const pr of GLR.progs) linkProgram(pr);
  for (const m of GLR.meshes) uploadMesh(m);
  for (const sm of GLR.simples) uploadSimple(sm);
  for (const pt of GLR.points) uploadPoints(pt);
  emptyVAO = gl.createVertexArray();
  buildGlowVAO();
  createFB();
  cubeTex = null;
  bakeSky();
  fxGL();
  dbgReset();
  ultraReset(); // Phase 6B: baked 'ultra' textures and tessellated VAOs are prepared again
  CAP.job = null; // a capture in flight is dropped
}
/* ---- dynamic resolution: hysteresis (slow over 0.6 s before stepping down, 2 s before stepping up), floor, HUD warning ---- */
let slowT = 0,
  fastT = 0,
  floorT = 0,
  warnShown = false;
function scaleTick(dt) {
  const floor = Math.min(CFG.MIN_RENDER_SCALE, quality.scale);
  if (frameEMA > CFG.TARGET_FRAME_MS + 4) {
    slowT += dt;
    fastT = 0;
  } else if (frameEMA < CFG.TARGET_FRAME_MS - 5) {
    fastT += dt;
    slowT = 0;
  } else {
    slowT = 0;
    fastT = 0;
  }
  if (slowT > 0.6 && renderScale > floor) {
    renderScale = Math.max(floor, renderScale - 0.05);
    slowT = 0;
  }
  if (fastT > 2.0 && renderScale < quality.scale) {
    renderScale = Math.min(quality.scale, renderScale + 0.05);
    fastT = 0;
  }
  if (renderScale <= floor + 1e-3 && frameEMA > CFG.TARGET_FRAME_MS + 4) floorT += dt;
  else floorT = 0;
  const warn = floorT > 5;
  if (warn !== warnShown) {
    warnShown = warn;
    const el = $('#warn');
    if (warn) el.textContent = t('hud.warn');
    el.style.opacity = warn ? 1 : 0;
  }
}
let last = performance.now(),
  fpsAcc = 0,
  fpsN = 0,
  fpsShown = 0;
// requestAnimationFrame driver. With DET.manual (debug build test API) it idles and the test API advances frames instead.
function frame(now) {
  if (DET.manual) {
    last = now;
    requestAnimationFrame(frame);
    return;
  }
  if (runFrame(now)) requestAnimationFrame(frame);
}
// one frame: simulate + render. Returns false after a fatal error (the loop then stops, as before).
function runFrame(now) {
  const raw = DET.on ? CFG.DET_DT * 1000 : now - last; // ?det=1: fixed step, independent of the real frame time
  last = now;
  const dt = Math.min(0.05, raw / 1000);
  fpsAcc += raw;
  fpsN++;
  if (fpsAcc > 500) {
    fpsShown = Math.round((fpsN * 1000) / fpsAcc);
    fpsAcc = 0;
    fpsN = 0;
  }
  if (glLost) return true;
  const cpu0 = performance.now();
  frameEMA = lerp(frameEMA, raw, 0.05);
  const probing = probeTick(raw); // Phase 6B first-run auto quality: holds the scaler while it measures
  if (!DET.noScale && !probing) scaleTick(dt); // ?det=1 / ?noscale=1: render scale stays at the preset's scale
  gamepadTick(dt);
  try {
    detFrameStart(dt, now);
    if (PHOTO.on) {
      if (!CAP.job) photoStep(dt); // the camera holds still while an HD photo is being rendered
      processUploads();
    } // photo mode: time frozen, free camera
    else if (started && !paused) {
      time += dt;
      if (INTRO.on) introStep(dt);
      else updatePlayer(dt);
      optionsTick(dt);
      streamTick(dt);
      processUploads();
      updateStructures();
      interiorTick(dt);
      engHumTick();
      sectorUpdate();
      updateMinnows(dt);
      updateWhales(dt);
      updateMedusae(dt);
      eventsTick(dt);
      gatherLights();
      updateDiscovery();
      logCheck(dt);
      signalHUD(dt);
      updateTrail();
      audioTick(dt);
      starVoiceTick(dt); // Phase 6C: signature of the nearest classed star
      planetVoiceTick(dt); // Phase 6D: new planet types, rogue planets, plume moons
      deepVoiceTick(dt); // Phase 6E: comets, outer belts, graveyards, the ancient ring, remnants and nebulae
      saveTick(dt);
    } else if (!started) {
      time += dt;
      processUploads();
      updateStructures();
      updateWhales(dt);
      updateMedusae(dt);
      updateMinnows(dt);
      gatherLights();
    }
    fxTick(dt);
    captionTick(dt);
    updateGrade(dt);
    ultraTick(); // Phase 6B: prepares 'ultra' resources a little per frame (nothing for the other presets)
    dbgGpuBegin();
    if (!captureStep()) render(); // while an HD capture runs, its offscreen passes replace the frame (the canvas keeps the last one)
    dbgGpuEnd();
    if (PHOTO.capture) {
      PHOTO.capture = false;
      if (CAP.fallback) {
        CAP.fallback = false;
        capturePNG();
      } else capturePhoto(); // scale 1: the canvas, read back in the same task before the buffer is presented; above 1: HD capture
    }
    updateHUD(dt, fpsShown);
    if (MAP.open) drawMap();
    recTick();
    wakeTick(dt);
    comfortTick(dt);
    dbgTick(dt, performance.now() - cpu0, raw);
    DET.cpuMs = performance.now() - cpu0;
    if (paused) {
      $('#pstats').textContent = t('pause.stats', { s: Math.round(renderScale * 100), f: fpsShown, seed: CFG.SEED });
      if ((frameIdx & 15) === 0) $('#pcaps').innerHTML = capsText();
    }
  } catch (e) {
    showErr(e.stack || String(e));
    return false;
  }

}
$('#begin').onclick = () => {
  started = true;
  $('#start').style.display = 'none';
  initAudio();
  if (AUD.ctx && AUD.ctx.state === 'suspended') AUD.ctx.resume();

  if (!isTouch) {
    try {
      const r = canvas.requestPointerLock();
      if (r && r.catch) r.catch(() => {});

};
// window resize: render() re-reads the canvas client size every frame and resizeFB() reallocates targets on change, so no handler is needed.
applyLang();
updateCount();
rebuildStarPoints();
// save on tab close as well (best effort)
addEventListener('pagehide', () => {
  dirty = true;
  saveT = 0;
  saveTick(0);
});
requestAnimationFrame(frame);

<script>
'use strict';
/* stage loader: runs each <script type="text/x-vb"> block as a global script, yielding between them;
   the loading overlay only appears when generation takes longer than a quarter of a second */
(function () {
  const st = [...document.querySelectorAll('script[type="text/x-vb"]')];
  const total = st.reduce((a, s) => a + (+s.dataset.w || 1), 0);
  const ov = document.getElementById('loading'),
    bar = document.getElementById('ldbar'),
    t0 = performance.now();
  let i = 0,
    done = 0,
    failed = false;
  try {
    const s = JSON.parse(localStorage.getItem('voidborne:settings') || '{}');
    const l = s.lang || ((navigator.language || '').toLowerCase().startsWith('id') ? 'id' : 'en');
    document.getElementById('ldtxt').textContent = l === 'id' ? 'MEMBANGKITKAN ALAM SEMESTA…' : 'GENERATING THE UNIVERSE…';
  } catch (e) {}
  addEventListener('error', (e) => {
    if (window.__vbReady) return;
    failed = true;
    ov.style.display = 'none';
    const b = document.getElementById('err');
    b.style.display = 'block';
    b.textContent += (e.message || 'error') + (e.lineno ? ' (line ' + e.lineno + ')' : '') + '\n';
  });
  const next = () => {
    if (document.visibilityState === 'visible') requestAnimationFrame(() => setTimeout(step, 0));
    else setTimeout(step, 0);
  };
  function step() {
    if (failed) return;
    if (i >= st.length) {
      window.__vbLoadMs = Math.round(performance.now() - t0);
      window.__vbReady = true;
      ov.classList.remove('show');
      setTimeout(() => ov.remove(), 700);
      return;
    }
    const s = st[i++],
      el = document.createElement('script');
    el.textContent = s.textContent;
    const ts = performance.now();
    document.body.appendChild(el);
    (window.__vbStageMs = window.__vbStageMs || []).push([s.dataset.name, Math.round(performance.now() - ts)]);
    done += +s.dataset.w || 1;
    bar.style.width = ((done / total) * 100).toFixed(1) + '%';
    if (performance.now() - t0 > 250) ov.classList.add('show');
    next();
  }
  next();
})();
</script>
